minimum_pre_commit_version: "4.2.0"
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: Format staged Python
        entry: uv run --locked ruff format
        language: system
        types: [python]
        stages: [pre-commit]
      - id: ruff-check
        name: Lint staged Python
        entry: uv run --locked ruff check --fix
        language: system
        types: [python]
        stages: [pre-commit]
      - id: biome
        name: Format and lint staged browser files
        entry: scripts/biome.sh check --write --no-errors-on-unmatched
        language: system
        types_or: [javascript, css, json]
        exclude: /vendor/
        stages: [pre-commit]
      - id: pre-push
        name: Type checking and unit/integration tests
        entry: scripts/pre-push.sh
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
