name: Quality
on:
  pull_request:
    # edited: the hygiene job reads the PR body from the event payload, and a
    # re-run reuses the original payload, so a changed body needs a new run.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
concurrency:
  # Pull requests share one group per branch so a newer push cancels the
  # superseded run. Pushes to main get a group per commit so no merge's run is
  # cancelled or replaced while queued; cancelling main runs hides red builds
  # when several PRs merge in quick succession.
  group: quality-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  quality:
    name: Required quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version-file: pyproject.toml
          enable-cache: true
      - run: uv python install 3.12
      - run: scripts/setup.sh
      - run: scripts/check.sh
      - run: scripts/install-browsers.sh --with-deps
      - run: scripts/e2e.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: scripts/cloudflare-check.sh --browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failure-evidence
          path: |
            test-results/
            browser-evidence/
            coverage.xml
          if-no-files-found: ignore
  workflow:
    name: Queue and PR hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Queue validation, link check and, on pull requests, the marker check.
      # The PR variables are empty on pushes, which skips the marker check.
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: bash docket/scripts/ci.sh
